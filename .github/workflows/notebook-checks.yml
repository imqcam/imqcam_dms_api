name: Notebook checks

on:
  push:
    paths:
      - "tutorials/04_file_collections.ipynb"
      - "scripts/check_notebooks.py"
      - ".github/workflows/notebook-checks.yml"

  pull_request:
    paths:
      - "tutorials/04_file_collections.ipynb"
      - "scripts/check_notebooks.py"
      - ".github/workflows/notebook-checks.yml"

jobs:
  validate-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install nbformat pyflakes

      - name: Validate file collections notebook
        run: python scripts/check_notebooks.py
